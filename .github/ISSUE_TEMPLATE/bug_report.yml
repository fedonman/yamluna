name: Bug report
description: Something behaves incorrectly or crashes.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What breaks, and the cause if you know it. Two to four sentences.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducible example
      description: The smallest thing that shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Only the lines that matter. Trim a traceback to the final frame and the error.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: System information
      description: Version, operating system, and anything else that changes the outcome.
    validations:
      required: true
