# covers: deep block nesting - twelve levels of mapping, a sequence of
# sequences of sequences, and a deep alternation of the two, to exercise
# indentation bookkeeping and any recursion limit in the loader or emitter.
deep_map:
  l1:
    l2:
      l3:
        l4:
          l5:
            l6:
              l7:
                l8:
                  l9:
                    l10:
                      l11: leaf
deep_seq:
  - - - - - - - - deep leaf
alternating:
  a:
    - b:
        - c:
            - d:
                - e: leaf
deep_flow: [[[[[[[[[[inner]]]]]]]]]]
