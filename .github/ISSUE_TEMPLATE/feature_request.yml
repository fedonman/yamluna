name: Feature request
description: Something the project should be able to do and cannot.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what should exist.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What you are trying to do, and what stops you today. Two to four sentences.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The wanted API in as few lines as possible. Leave this empty if you have no view.
    validations:
      required: false
